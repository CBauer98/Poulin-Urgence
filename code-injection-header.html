<style id="pei-header-css">
/* ============================================================================
   3. HEADER — "filament" concept  (replaces the WHOLE former section 3)
   Squarespace prerequisites:
     • Edit Site Header → Style: Solid (any colour — the CSS makes it glass)
     • Edit Site Header → Elements → Logo: PEI_logo_C_trad_metal_h120.png
     • Edit Site Header → Elements → Button ON: text "Soumission", link /contact
     • Marketing → Announcement Bar: OFF (the utility strip is injected by the script)
   Depends on 2_Code_Injection_Footer.html (strip, mega-menu, scrolled state).
   ============================================================================ */
/* ---- 3a. Local variables ---- */
:root {
  --pei-steel: #C9CCD1;
  --pei-steel-2: #8A8F96;
  --pei-ember: #F07A2A;
  --pei-glass: rgba(5, 5, 5, 0.58);
  --pei-glass-solid: rgba(5, 5, 5, 0.92);
}
/* ---- 3b. The bar: glass, no Squarespace border ---- */
.header,
.header-inner,
.header-background {
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
}
.header-announcement-bar-wrapper {
  background: var(--pei-glass) !important;
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  transition: background 0.25s;
}
body.pei-scrolled .header-announcement-bar-wrapper {
  background: var(--pei-glass-solid) !important;
}
.header-inner {
  padding-top: 0 !important;
  padding-bottom: 0 !important;
  min-height: 88px;
  display: flex;
  align-items: center;
  transition: min-height 0.25s;
}
body.pei-scrolled .header-inner {
  min-height: 64px;
}
@media (max-width: 799px) {
  .header-inner,
  body.pei-scrolled .header-inner {
    min-height: 66px;
    padding-left: 18px !important;
    padding-right: 12px !important;
  }
}
.header a[href="/cart"],
.header-actions-action--cart,
.header-actions-action--social {
  display: none !important;
}
/* filament: red → ember line under the whole bar */
.header-announcement-bar-wrapper {
  position: relative;
}
.header-announcement-bar-wrapper::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -2px;
  height: 2px;
  pointer-events: none;
  background: linear-gradient(90deg, rgba(214, 58, 52, 0) 0%, rgba(214, 58, 52, 0.55) 18%, rgba(214, 58, 52, 0.9) 45%, rgba(240, 122, 42, 0.95) 52%, rgba(214, 58, 52, 0.55) 70%, rgba(214, 58, 52, 0) 100%);
  box-shadow: 0 0 14px rgba(214, 58, 52, 0.55), 0 0 32px rgba(214, 58, 52, 0.25);
}
/* Squarespace's own announcement bar must stay off: the injected strip replaces it */
.sqs-announcement-bar-dropzone,
.sqs-announcement-bar,
.sqs-announcement-bar-custom-location {
  display: none !important;
  height: 0 !important;
}
/* ---- 3c. Utility strip (injected by the script) ---- */
.pei-strip {
  height: 36px;
  background: #050505;
  border-bottom: 1px solid #1c1d20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4vw;
  font-family: var(--pei-body);
  font-size: 12px;
  color: #9A9EA5;
  transition: height 0.25s, opacity 0.2s;
  overflow: hidden;
}
body.pei-scrolled .pei-strip {
  height: 0;
  opacity: 0;
  border-bottom-width: 0;
}
.pei-strip__group {
  display: flex;
  align-items: center;
  gap: 28px;
  white-space: nowrap;
  flex: 0 0 auto;
}
.pei-strip__item {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #C9CCD1 !important;
  text-decoration: none !important;
}
.pei-strip__item strong {
  color: #FFFFFF !important;
  font-weight: 500;
}
.pei-strip__item svg {
  width: 13px;
  height: 13px;
  stroke: var(--pei-red);
  stroke-width: 2;
  fill: none;
}
.pei-strip__item:hover {
  color: #FFFFFF !important;
}
.pei-strip__lang {
  letter-spacing: 0.08em;
  color: #9A9EA5;
  text-decoration: none !important;
}
.pei-strip__lang b {
  color: #E6E7EA;
  font-weight: 500;
}
@media (max-width: 799px) {
  .pei-strip {
    height: 30px;
    padding: 0 18px;
  }
  .pei-strip__hours {
    display: none;
  }
}

  transition: height 0.25s;
}
body.pei-scrolled .header-title-logo img {
  height: 34px !important;
}
@media (max-width: 799px) {
  .header-title-logo img,
  body.pei-scrolled .header-title-logo img {
    height: 28px !important;
  }
}
/* ---- 3e. Desktop layout: logo — nav — button ---- */
@media (min-width: 800px) {
  .header-display-desktop {
    display: flex !important;
    align-items: center;
    gap: 30px;
    flex-wrap: nowrap;
    width: 100%;
  }
  .header-title-nav-wrapper {
    display: flex !important;
    align-items: center;
    gap: 44px;
    flex: 1 1 auto;
    min-width: 0;
  }
  .header-title {
    flex: 0 0 auto;
  }
  .header-nav {
    flex: 1 1 auto;
    margin: 0 !important;
    text-align: left !important;
  }
  .header-nav-list {
    display: flex;
    justify-content: flex-end !important;
    align-items: center;
    gap: 34px;
  }
  .header-actions,
  .header-actions--right {
    display: flex !important;
    align-items: center;
    gap: 12px;
    margin-left: 0;
    flex: 0 0 auto;
  }
  .header-burger {
    display: none !important;
  }
}
/* ---- 3f. Nav links: Oswald, uppercase, ember glow ---- */
.header-nav-item {
  margin: 0 !important;
  position: relative;
}
@media (min-width: 800px) {
  /* item spans the full bar height: the panel opens right under the filament, no hover gap */
  .header-nav-item {
    height: 88px;
    display: flex;
    align-items: center;
    transition: height 0.25s;
  }
  body.pei-scrolled .header-nav-item {
    height: 64px;
  }
}
.header-nav-item > a,
.header-nav-folder-title {
  font-family: var(--pei-head) !important;
  font-size: 15px !important;
  font-weight: 500 !important;
  letter-spacing: 0.07em !important;
  text-transform: uppercase !important;
  color: #E6E7EA !important;
  padding: 10px 2px !important;
  background: none !important;
  border-radius: 0 !important;
  white-space: nowrap !important;
  text-decoration: none !important;
  transition: color 0.15s;
}
.header-nav-item > a:hover,
.header-nav-folder-title:hover {
  color: #FFFFFF !important;
}
/* active item or open folder: ember bar with glow */
.header-nav-item--active > a::before,
.header-nav-item--folder:hover > .header-nav-folder-title::before,
.header-nav-item--folder:focus-within > .header-nav-folder-title::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 3px;
  background: var(--pei-ember);
  box-shadow: 0 0 10px var(--pei-red), 0 0 22px rgba(214, 58, 52, 0.7);
}
.header-nav-item--active > a,
.header-nav-item--folder:hover > .header-nav-folder-title {
  color: #FFFFFF !important;
}
/* chevron */
.header-nav-folder-title::after {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-left: 9px;
  position: relative;
  top: -3px;
  border-right: 1.5px solid var(--pei-steel-2);
  border-bottom: 1.5px solid var(--pei-steel-2);
  transform: rotate(45deg);
  transition: transform 0.15s, border-color 0.15s;
}
.header-nav-item--folder:hover > .header-nav-folder-title::after {
  transform: rotate(-135deg);
  top: 1px;
  border-color: var(--pei-ember);
}
/* ---- 3g. Dropdown panel: two-column mega-menu + call-out ---- */
.header-nav-folder-content {
  background: #0a0a0b !important;
  border: 1px solid #1f2024 !important;
  border-top: 0 !important;
  border-radius: 0 !important;
  padding: 10px 0 !important;
  top: 100% !important;
  margin-top: 2px !important;
  min-width: 320px !important;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6) !important;
  text-align: left !important;
}
.header-nav-folder-item {
  padding: 0 !important;
}
.header-nav-folder-item a {
  display: flex !important;
  flex-direction: column;
  gap: 5px;
  padding: 18px 20px !important;
  text-align: left !important;
  border-left: 2px solid transparent;
  white-space: normal !important;
  text-decoration: none !important;
  transition: background 0.15s, border-color 0.15s;
}
.header-nav-folder-item a:hover {
  background: #111214 !important;
  border-left-color: var(--pei-red);
}
.header-nav-folder-item-content {
  display: block;
  font-family: var(--pei-head) !important;
  font-size: 17px !important;
  font-weight: 500 !important;
  letter-spacing: 0.04em !important;
  text-transform: uppercase !important;
  color: #E6E7EA !important;
  background-image: none !important;
  text-decoration: none !important;
}
.header-nav-folder-item--active .header-nav-folder-item-content {
  color: #FFFFFF !important;
  background-image: none !important;
}
.header-nav-folder-item a:hover .header-nav-folder-item-content {
  color: #FFFFFF !important;
}
.pei-nav-desc {
  display: block;
  font-family: var(--pei-body);
  font-size: 13px;
  line-height: 1.45;
  font-weight: 400;
  color: #9A9EA5 !important;
  text-transform: none;
  letter-spacing: 0;
}
/* folders with 4+ pages: two columns + call-out (class added by the script) */
.header-nav-folder-content {
  left: auto !important;
  right: 0 !important;
  transform: none !important;
}
.header-nav-item--folder:hover > .header-nav-folder-content.pei-mega,
.header-nav-item--folder:focus-within > .header-nav-folder-content.pei-mega {
  display: grid !important;

}
.pei-mega > .header-nav-folder-item:nth-child(odd) {

}
.pei-mega > .header-nav-folder-item:nth-child(even) {

}
.pei-menu-side {

}
.pei-menu-side__v {
  font-family: var(--pei-head) !important;
  font-size: 24px !important;
  color: #FFFFFF !important;
  text-decoration: none !important;
  background-image: none !important;
}
.pei-menu-side__v:hover {
  color: var(--pei-ember) !important;
}
.pei-menu-side__s {
  font-family: var(--pei-body) !important;
  font-size: 13px !important;
  line-height: 1.45;
  color: #C9CCD1 !important;
}
.pei-menu-side__s a {
  color: #FFFFFF !important;

/* ---- 3g-bis. Menu déroulant « tolérant » (25 sept.) : reste ouvert ~0,4 s quand la souris
   quitte le titre, pas d'espace entre la barre et le panneau, pont invisible au-dessus du panneau.
   La classe .pei-open est posée par le script (section H). ---- */
@media (min-width: 800px) {
  .header-nav-folder-content { margin-top: 0 !important; }

    /* garde le panneau dans l'écran (ex. « À propos » débordait à gauche) */
    function fit(item) {
      var p = item.querySelector('.header-nav-folder-content');
      if (!p) return;
      p.style.removeProperty('transform');
      var r = p.getBoundingClientRect(), m = 16, dx = 0;
      if (r.left < m) dx = m - r.left; else if (r.right > window.innerWidth - m) dx = window.innerWidth - m - r.right;
      if (dx) p.style.setProperty('transform', 'translateX(' + Math.round(dx) + 'px)', 'important');
    }
    function close(el) { if (el) el.classList.remove('pei-open'); if (open === el) open = null; }
    document.addEventListener('pointerover', function (e) {
      var item = e.target.closest && e.target.closest('.header-nav-item--folder');
      if (!item || !item.closest('.header-nav')) return;
      clearTimeout(timer);
      if (open && open !== item) close(open);
      item.classList.add('pei-open'); open = item;
      fit(item);
    });
    document.addEventListener('pointerout', function (e) {
      var item = e.target.closest && e.target.closest('.header-nav-item--folder');
      if (!item || item !== open) return;
      if (e.relatedTarget && item.contains(e.relatedTarget)) return;
      clearTimeout(timer);
      timer = setTimeout(function () { close(item); }, DELAY);
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(open); });
  }

  /* ---------- I. Hauteur réelle de l'en-tête → --pei-header-h (le héros commence juste dessous) ---------- */
  function headerOffset() {
    var h = document.querySelector('.header');
    if (!h || document.body.classList.contains('pei-scrolled')) return;
    var b = Math.round(h.getBoundingClientRect().bottom + (window.scrollY || 0));
    if (b > 40) document.documentElement.style.setProperty('--pei-header-h', b + 'px');
    if (window.ResizeObserver && !window.__peiRO) { window.__peiRO = new ResizeObserver(function () { headerOffset(); }); window.__peiRO.observe(h); }
  }

    /* v3.9 : le formulaire et les avis (GitHub Pages, dans des iframes) suivent la langue Weglot */
  function syncFrames() {
    var ORIGIN = 'https://cbauer98.github.io';
    var send = function (f) { try { f.contentWindow.postMessage({ type: 'pei-lang', lang: curLang().indexOf('fr') === 0 ? 'fr' : 'en' }, ORIGIN); } catch (e) {} };
    document.querySelectorAll('iframe[src*="cbauer98.github.io"]').forEach(function (f) {
      if (!f.__peiLang) { f.__peiLang = true; f.addEventListener('load', function () { send(f); }); }
      send(f);
    });
  }

  function run() { lang = curLang(); fr = lang.indexOf('fr') === 0; map = fr ? DESC.fr : DESC.en; addDescriptions(); clickableFolders(); megaMenus(); addStrip(); quoteButton(); mobileFoot(); headerOffset(); syncFrames(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run); else run();
  window.addEventListener('load', run); /* second pass: Squarespace sometimes re-renders the header */

  /* v3.8 : Weglot — re-render the language-dependent pieces once Weglot starts, and on every language switch */
  function rerender() {
    document.querySelectorAll('.pei-nav-desc, .pei-menu-side, .pei-strip, .pei-menu-foot').forEach(function (n) { n.remove(); });
    run();
  }
  function hookWeglot() {
    if (window.__peiWeglot || !window.Weglot || typeof Weglot.on !== 'function') return;
    window.__peiWeglot = true;
    Weglot.on('initialized', rerender);
    Weglot.on('languageChanged', rerender);
    if (Weglot.initialized || (Weglot.getCurrentLang && Weglot.getCurrentLang())) rerender();
  }
  window.addEventListener('load', hookWeglot);
  scrollState();
  hoverIntent();
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(headerOffset, 150); });
  headerOffset();
})();
</script>
